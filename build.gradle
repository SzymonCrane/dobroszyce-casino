buildscript {
    repositories { maven { url = 'https://maven.minecraftforge.net/' }; mavenCentral() }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:3.0.197' }
}
apply plugin: 'net.minecraftforge.gradle'
version = '1.2.0'
group = 'pl.szymon.casino'
archivesBaseName = 'dobroszyce-casino-1.12.2'
sourceCompatibility = targetCompatibility = '1.8'
minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'
    runs {
        client {
            workingDirectory project.file('run')
            mods { dobroszycecasino { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run-server')
            mods { dobroszycecasino { source sourceSets.main } }
        }
    }
}
dependencies { minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860' }
sourceSets.main.output.resourcesDir = sourceSets.main.output.classesDirs.singleFile
jar.finalizedBy('reobfJar')
task logicTest(type: JavaExec, dependsOn: testClasses) {
    classpath = sourceSets.test.runtimeClasspath
    main = 'pl.szymon.casino.RoundTest'
}
check.dependsOn logicTest

task rouletteTest(type: JavaExec, dependsOn: testClasses) {
    classpath = sourceSets.test.runtimeClasspath
    main = "pl.szymon.casino.RouletteTest"
}
check.dependsOn rouletteTest

task shopTest(type: JavaExec, dependsOn: testClasses) {
    classpath = sourceSets.test.runtimeClasspath
    main = 'pl.szymon.casino.ShopRulesTest'
}
check.dependsOn shopTest
